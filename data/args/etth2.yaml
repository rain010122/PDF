path:
  root_path: ./data/dataset/
  data_path: ETTh2.csv
  log_path: ./data/logs/log.log

common:
  model_name: PDF           
  model_id: ETTh2_720_96        #
  data: ETTh2

model_params:
  features: M
  random_seed: 2021
  is_training: 1
  seq_len: 720
  pred_len: 96

  enc_in: 7
  e_layers: 3
  n_heads: 4
  d_model: 16
  d_ff: 128

  # dropout
  dropout: 0.6
  fc_dropout: 0.4

  # kernel/period/patch/stride参数（保持列表格式）
  kernel_list: [3, 7, 11]
  period: [24, 180, 720]
  patch_len: [4, 16, 48]
  stride: [4, 16, 48]

train_params:
  des: Exp
  train_epochs: 100
  patience: 10
  itr: 1
  batch_size: 128
  learning_rate: 0.0001